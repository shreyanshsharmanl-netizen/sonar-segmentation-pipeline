name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=src --cov-fail-under=70

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app:${{ github.sha }} .
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8000:8000 app:${{ github.sha }}
          for i in $(seq 1 45); do curl -fs localhost:8000/readyz && exit 0; sleep 2; done
          docker logs app; exit 1
      - name: Publish on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}
          docker tag app:${{ github.sha }} $image
          docker push $image
